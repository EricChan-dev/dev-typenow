<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="陈应帅">
  <!-- 个人作品集的字母/姓氏标记。用深墨底 + 米白衬线字，
       在小尺寸标签页里对比度足够，且与站点「杂志编辑感」的衬线标题一致。 -->
  <rect width="32" height="32" rx="6" fill="#1a1a1a"/>
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Songti SC', 'Noto Serif SC', serif"
        font-size="21" fill="#faf8f5">陈</text>
</svg>
