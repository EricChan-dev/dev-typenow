<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="陈应帅">
  <!-- 个人作品集的姓氏标记。渐变底取自站点的蓝→紫强调色，白字保证小尺寸下的对比度。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, 'PingFang SC', sans-serif"
        font-weight="700" font-size="19" fill="#ffffff">陈</text>
</svg>
